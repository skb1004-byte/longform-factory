worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream n8n_backend      { server lf2_n8n:5678; keepalive 32; }
    upstream ffmpeg_backend   { server lf2_ffmpeg:8002; }
    upstream tts_backend      { server lf2_tts:8001; }
    upstream uploader_backend { server lf2_uploader:8003; }
    upstream mcp_backend      { server lf2_ai_mcp:8010; }

    server {
        listen 80;
        server_name _;
        client_max_body_size 2G;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        absolute_redirect off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-LF-API-Key, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        location /dashboard {
            alias /usr/share/nginx/html/;
            index dashboard.html;
            try_files $uri $uri/ /dashboard.html =404;
            # 대시보드 HTML 은 절대 캐시하지 않는다.
            # 고쳐서 배포해도 브라우저가 옛 파일을 들고 있으면
            # 사용자는 '안 고쳐졌다'고 보게 된다(중지 버튼이 그랬다).
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            etag off;
        }

        location /n8n/ {
            proxy_pass http://n8n_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Origin http://localhost:8080;
            proxy_set_header Host lf2_n8n:5678;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_redirect http://n8n:5678/ /n8n/;
        }

        location /complete/ {
            alias /data/complete/;
            autoindex off;
            add_header Content-Disposition attachment;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location /output/ {
            alias /data/output/;
            autoindex off;
            mp4;
            mp4_buffer_size     1m;
            mp4_max_buffer_size 5m;
            add_header Accept-Ranges bytes always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location /api/ffmpeg/video/stream/ {
            proxy_pass http://ffmpeg_backend/video/stream/;
            proxy_set_header Host $host;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /api/ffmpeg/ {
            proxy_pass http://ffmpeg_backend/;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location /settings/ {
            proxy_pass http://ffmpeg_backend/settings/;
            proxy_set_header Host $host;
            proxy_set_header X-LF-API-Key $http_x_lf_api_key;
            proxy_read_timeout 60s;
        }

        location /api/providers/ {
            proxy_pass http://ffmpeg_backend/providers/;
            proxy_set_header Host $host;
            proxy_set_header X-LF-API-Key $http_x_lf_api_key;
            proxy_read_timeout 30s;
        }

        location /api/tts/ {
            proxy_pass http://tts_backend/;
            proxy_set_header Host $host;
        }

        location /api/upload/ {
            proxy_pass http://uploader_backend/;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }

        location /api/mcp/ {
            proxy_pass http://mcp_backend/;
            proxy_set_header Host $host;
        }

        location /api/auto/ {
            proxy_pass http://ffmpeg_backend/api/auto/;
            proxy_set_header Host $host;
            proxy_set_header X-LF-API-Key $http_x_lf_api_key;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = / {
            return 302 /dashboard/;
        }
    }
}