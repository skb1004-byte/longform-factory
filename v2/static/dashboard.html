<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LongForm Factory — 대시보드 v3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        lf: {
          bg: '#060B17', card: '#0D1526', border: '#1A2540',
          cyan: '#00D4FF', purple: '#7B2FBE', gold: '#FFD700',
          green: '#10B981', red: '#EF4444', yellow: '#F59E0B',
          blue: '#3B82F6', indigo: '#6366F1',
        }
      },
      animation: {
        'pulse-slow': 'pulse 3s cubic-bezier(0.4,0,0.6,1) infinite',
        'fade-in': 'fadeIn 0.3s ease',
        'slide-up': 'slideUp 0.3s ease',
      }
    }
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  body { background: #060B17; font-family: 'Segoe UI', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: #0D1526; }
  ::-webkit-scrollbar-thumb { background: #1A2540; border-radius: 2px; }
  .glow-cyan  { box-shadow: 0 0 24px rgba(0,212,255,0.12); }
  .glow-purple{ box-shadow: 0 0 24px rgba(123,47,190,0.18); }
  .glow-green { box-shadow: 0 0 24px rgba(16,185,129,0.12); }
  .gradient-text { background: linear-gradient(135deg, #00D4FF, #7B2FBE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .gradient-btn  { background: linear-gradient(135deg, #00D4FF, #7B2FBE); }
  .gradient-yt   { background: linear-gradient(135deg, #FF0000, #CC0000); }
  .card-hover { transition: all 0.2s; }
  .card-hover:hover { transform: translateY(-2px); }
  .tab-active { border-bottom: 2px solid #00D4FF; color: #00D4FF; }
  .tab-inactive { border-bottom: 2px solid transparent; color: #6B7280; }
  @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
  @keyframes slideUp { from { transform:translateY(8px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .shimmer { background: linear-gradient(90deg,#1A2540 25%,#243054 50%,#1A2540 75%); background-size:200px 100%; animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 0%{background-position:-200px 0} 100%{background-position:calc(200px+100%) 0} }
  input, select, textarea { color-scheme: dark; }
  .news-chip { cursor:pointer; transition: all 0.15s; border:1px solid #1A2540; }
  .news-chip:hover { border-color: rgba(0,212,255,0.4); background: rgba(0,212,255,0.08); color:#00D4FF; }

  /* ── 진행 중 반짝임 효과 ── */
  @keyframes border-glow {
    0%,100% { box-shadow: 0 0 6px rgba(0,212,255,0.15), inset 0 0 6px rgba(0,212,255,0.03); border-color: rgba(0,212,255,0.25); }
    50%      { box-shadow: 0 0 18px rgba(0,212,255,0.45), 0 0 32px rgba(123,47,190,0.25), inset 0 0 10px rgba(0,212,255,0.06); border-color: rgba(0,212,255,0.65); }
  }
  @keyframes progress-shine {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes sparkle-float {
    0%   { transform: translateY(0) scale(1);   opacity: 1; }
    100% { transform: translateY(-18px) scale(0); opacity: 0; }
  }
  @keyframes status-pulse {
    0%,100% { text-shadow: 0 0 4px currentColor; opacity: 1; }
    50%      { text-shadow: 0 0 12px currentColor, 0 0 20px currentColor; opacity: 0.85; }
  }
  @keyframes twinkle {
    0%,100% { opacity:0; transform: scale(0.4) rotate(0deg); }
    50%      { opacity:1; transform: scale(1.2) rotate(180deg); }
  }
  .job-active {
    animation: border-glow 2s ease-in-out infinite;
    border-color: rgba(0,212,255,0.3) !important;
  }
  .progress-bar-active {
    background: linear-gradient(90deg, var(--bar-color,#3B82F6) 0%, #00D4FF 45%, #fff 50%, #00D4FF 55%, var(--bar-color,#3B82F6) 100%);
    background-size: 200% 100%;
    animation: progress-shine 2s linear infinite;
  }
  .status-label-active { animation: status-pulse 1.8s ease-in-out infinite; }
  .sparkle-dot {
    position: absolute; pointer-events: none;
    font-size: 10px; line-height: 1;
    animation: sparkle-float 1.6s ease-out infinite;
  }
  .twinkle-star {
    display: inline-block;
    animation: twinkle 1.2s ease-in-out infinite;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const BASE   = 'http://localhost:8080';
const LF_KEY = 'longform-2026-secret';
const HEADERS_JSON = { 'Content-Type': 'application/json', 'X-LF-API-Key': LF_KEY };

const API = {
  health: {
    tts:      `${BASE}/api/tts/health`,
    ffmpeg:   `${BASE}/api/ffmpeg/health`,
    uploader: `${BASE}/api/upload/health`,
    mcp:      `${BASE}/api/mcp/health`,
    nginx:    `${BASE}/health`,
    n8n:      `${BASE}/n8n/healthz`,
  },
  providers:   `${BASE}/api/mcp/providers`,
  providerPing:`${BASE}/api/ffmpeg/providers/ping`,
  generate:    `${BASE}/api/mcp/generate/script`,
  ytUpload:    `${BASE}/api/upload/upload/youtube`,
  autoJobs:    `${BASE}/api/ffmpeg/api/auto/jobs`,
  autoCreate:  `${BASE}/api/ffmpeg/api/auto/topic-job`,
  autoStatus:  (id) => `${BASE}/api/ffmpeg/api/auto/jobs/${id}/status`,
  ffmpegHealth:`${BASE}/api/ffmpeg/health`,
};

const SERVICES = [
  { key:'nginx',    name:'Nginx',    icon:'🔀', desc:'Reverse Proxy' },
  { key:'n8n',      name:'n8n',      icon:'⚡', desc:'Workflow Engine' },
  { key:'mcp',      name:'AI-MCP',   icon:'🧠', desc:'Multi-Provider AI' },
  { key:'tts',      name:'TTS',      icon:'🎙️', desc:'Edge+Kokoro' },
  { key:'ffmpeg',   name:'FFmpeg',   icon:'🎬', desc:'Video Worker' },
  { key:'uploader', name:'Uploader', icon:'📺', desc:'YouTube / SNS' },
];

const PROVIDERS_META = {
  claude:     { label:'Claude',      icon:'🟣', type:'online'  },
  gemini:     { label:'Gemini',      icon:'🔵', type:'online'  },
  openrouter: { label:'OpenRouter',  icon:'🌐', type:'online'  },
  cerebras:   { label:'Cerebras',    icon:'⚡', type:'online'  },
  groq:       { label:'Groq',        icon:'🚀', type:'online'  },
  xai:        { label:'Grok (xAI)',  icon:'𝕏',  type:'online'  },
  sambanova:  { label:'SambaNova',  icon:'🦙', type:'online'  },
  apifreellm: { label:'ApiFreeLLM', icon:'🆓', type:'online'  },
  arliai:     { label:'ArliAI',      icon:'🤖', type:'online'  },
  openai:     { label:'OpenAI',      icon:'🟢', type:'online'  },
  ollama:     { label:'Ollama',      icon:'🦙', type:'offline' },
  gpt4all:    { label:'GPT4All',     icon:'💻', type:'offline' },
  deepseek:   { label:'DeepSeek',    icon:'🐳', type:'online'  },
};

const TODAY_TOPICS = [
  '2026년 북한 SLBM 발사 한반도 안보 위기',
  '트럼프 행정부 관세 전쟁 글로벌 경제 충격',
  '삼성전자 HBM4 양산 AI 반도체 시장 판도',
  '한국 AI 스타트업 투자 붐 2026',
  '중국 딥시크 v3 GPT-5 경쟁',
  '2026 부동산 시장 서울 집값 전망',
];

const MODE_LABELS = { longform:'🎬 롱폼', shorts:'📱 숏폼', music_video:'🎵 뮤직비디오' };

function cls(...a) { return a.filter(Boolean).join(' '); }

function StatusDot({ status, animated=true }) {
  const c = { healthy:'bg-green-400', degraded:'bg-yellow-400', offline:'bg-red-500', loading:'bg-gray-600' };
  return <span className={cls('inline-block w-1.5 h-1.5 rounded-full', c[status]||c.loading, animated&&status==='healthy'&&'animate-pulse')} />;
}

function StatusBadge({ status }) {
  const m = { healthy:{color:'text-green-400',bg:'bg-green-400/10',label:'Online'}, degraded:{color:'text-yellow-400',bg:'bg-yellow-400/10',label:'Degraded'}, offline:{color:'text-red-400',bg:'bg-red-400/10',label:'Offline'}, loading:{color:'text-gray-500',bg:'bg-gray-700/30',label:'...'} };
  const s = m[status]||m.loading;
  return <span className={cls('inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium',s.color,s.bg)}><StatusDot status={status}/>{s.label}</span>;
}

function ServiceCard({ service, status, latency }) {
  return (
    <div className={cls('border rounded-xl p-3.5 card-hover bg-lf-card border-lf-border', status==='healthy'&&'border-green-900/40')}>
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-sm">{service.icon}</div>
          <div>
            <div className="text-white text-sm font-semibold leading-tight">{service.name}</div>
            <div className="text-gray-600 text-xs">{service.desc}</div>
          </div>
        </div>
        <div className="text-right">
          <StatusBadge status={status}/>
          {latency&&<div className="text-xs text-gray-700 mt-0.5">{latency}ms</div>}
        </div>
      </div>
    </div>
  );
}

function ProviderGrid({ providers, lastUsed }) {
  return (
    <div className="bg-lf-card border border-lf-border rounded-xl p-5">
      <div className="flex items-center justify-between mb-4">
        <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider">AI 프로바이더</h3>
        <span className="text-xs text-gray-500 flex items-center gap-1"><StatusDot status="healthy"/>병렬 AUTO</span>
      </div>
      <div className="grid grid-cols-2 gap-2">
        {Object.entries(PROVIDERS_META).map(([key, meta]) => {
          const pData=providers[key]; const avail=pData?.available; const model=pData?.model; const isUsed=lastUsed===key; const isOff=meta.type==='offline';
          return (
            <div key={key} className={cls('flex items-center justify-between px-3 py-2 rounded-lg border transition-all',
              isUsed?'border-cyan-500/50 bg-cyan-500/5':avail?'border-lf-border bg-white/2 hover:border-gray-600':isOff?'border-purple-900/40 bg-purple-900/5 opacity-70':'border-lf-border/50 opacity-50')}>
              <div className="flex items-center gap-2 min-w-0">
                <span className="text-sm">{meta.icon}</span>
                <div className="min-w-0">
                  <div className="flex items-center gap-1"><span className="text-xs font-medium text-white">{meta.label}</span>{isUsed&&<span className="text-xs text-cyan-400">★</span>}{isOff&&!avail&&<span className="text-xs text-purple-500">오프</span>}</div>
                  {model&&<div className="text-xs text-gray-600 truncate" style={{maxWidth:90}}>{model}</div>}
                </div>
              </div>
              <div className="ml-2 shrink-0">{avail===undefined?<span className="text-gray-700 text-xs">…</span>:avail?<span className="text-green-400 text-xs">✓</span>:<span className="text-gray-700 text-xs">✗</span>}</div>
            </div>
          );
        })}
      </div>
      <div className="mt-3 pt-3 border-t border-lf-border/50 text-xs text-gray-600">🔄 클라우드 6개 병렬 → GPT4All·Ollama 폴백</div>
    </div>
  );
}

function StatCard({ icon, label, value, sub, color }) {
  return (
    <div className="bg-lf-card border border-lf-border rounded-xl p-4 card-hover">
      <div className="flex items-center justify-between">
        <div><div className="text-gray-600 text-xs mb-1">{label}</div><div className={cls('text-2xl font-bold',color)}>{value}</div>{sub&&<div className="text-gray-700 text-xs mt-0.5">{sub}</div>}</div>
        <div className="text-2xl opacity-40">{icon}</div>
      </div>
    </div>
  );
}

function JobCard({ job, onCancel, onYTUpload }) {
  const [elapsed, setElapsed] = useState(0);
  useEffect(() => { const t=setInterval(()=>setElapsed(Math.floor((Date.now()-job.startedAt)/1000)),1000); return ()=>clearInterval(t); }, [job.startedAt]);
  const sm = {
    pending:             {color:'text-yellow-400', bar:'bg-yellow-400',   label:'⏳ 대기'},
    queued:              {color:'text-yellow-500', bar:'bg-yellow-500',   label:'⏳ 큐 대기'},
    generating:          {color:'text-cyan-400',   bar:'bg-cyan-400',     label:'🧠 스크립트'},
    generating_script:   {color:'text-cyan-400',   bar:'bg-cyan-400',     label:'🧠 원고 생성'},
    asset_searching:     {color:'text-indigo-400', bar:'bg-indigo-400',   label:'🔍 자산 검색'},
    downloading_assets:  {color:'text-indigo-300', bar:'bg-indigo-300',   label:'⬇ 자산 다운'},
    tts:                 {color:'text-purple-400', bar:'bg-purple-400',   label:'🎙️ TTS'},
    tts_generating:      {color:'text-purple-400', bar:'bg-purple-400',   label:'🎙️ TTS 생성'},
    assets:              {color:'text-indigo-400', bar:'bg-indigo-400',   label:'🔍 소스'},
    rendering:           {color:'text-blue-400',   bar:'bg-blue-400',     label:'🎬 렌더링'},
    video_rendering:     {color:'text-blue-500',   bar:'bg-blue-500',     label:'🎬 영상 합성'},
    finalizing:          {color:'text-emerald-400',bar:'bg-emerald-400',  label:'✨ 마무리'},
    uploading:           {color:'text-green-400',  bar:'bg-green-400',    label:'📺 업로드'},
    completed:           {color:'text-green-400',  bar:'bg-green-400',    label:'✅ 완료'},
    done:                {color:'text-green-400',  bar:'bg-green-400',    label:'✅ 완료'},
    failed:              {color:'text-red-400',    bar:'bg-red-500',      label:'❌ 실패'},
    error:               {color:'text-red-400',    bar:'bg-red-500',      label:'❌ 오류'},
  };
  const s=sm[job.status]||sm.pending; const mins=Math.floor(elapsed/60); const secs=elapsed%60;
  const isActive = !['done','completed','error','failed'].includes(job.status);
  // Sparkle positions: randomly offset but deterministic per job id
  const sparkleSeeds = React.useMemo(()=>{
    const h = (job.id||'x').split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    return [0,1,2,3].map(i=>({ l:(h*7+i*31)%90, delay:(h*3+i*17)%1600/1000, dur:1.2+(h*5+i*11)%8/10 }));
  },[job.id]);
  return (
    <div className={cls('bg-lf-card border border-lf-border rounded-xl p-4 card-hover relative overflow-hidden', isActive&&'job-active')}>
      {/* ✦ sparkle particles — active only */}
      {isActive && sparkleSeeds.map((sp,i)=>(
        <span key={i} className="sparkle-dot" style={{left:`${sp.l}%`, bottom:'6px', animationDelay:`${sp.delay}s`, animationDuration:`${sp.dur}s`}}>
          {['✦','✧','⋆','·'][i%4]}
        </span>
      ))}
      <div className="flex items-start justify-between mb-2">
        <div className="flex-1 min-w-0">
          <div className="text-white font-medium text-sm truncate">{job.topic}</div>
          <div className="text-gray-600 text-xs mt-0.5">{job.id} · {MODE_LABELS[job.mode]||'🎬 롱폼'}</div>
          {job.provider&&<div className="text-xs text-cyan-600 mt-0.5">🤖 {job.isAuto?<><span className="twinkle-star">⚡</span> Auto v15.95</>:job.provider}</div>}
        </div>
        <span className={cls('ml-2 text-xs font-semibold shrink-0', s.color, isActive&&'status-label-active')}>{s.label}</span>
      </div>
      <div className="mb-2">
        <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden relative">
          {isActive
            ? <div className="progress-bar-active h-full rounded-full transition-all duration-700"
                style={{width:`${job.progress||0}%`, '--bar-color': s.bar.replace('bg-','').includes('blue')?'#3B82F6':s.bar.replace('bg-','').includes('purple')?'#A855F7':s.bar.replace('bg-','').includes('green')?'#10B981':'#00D4FF'}}/>
            : <div className={cls('h-full rounded-full transition-all duration-500',s.bar)} style={{width:`${job.progress||0}%`,opacity:0.85}}/>
          }
        </div>
      </div>
      <div className="flex items-center justify-between text-xs text-gray-600">
        <span>⏱ {mins}:{String(secs).padStart(2,'0')} · {job.progress||0}%{job.step&&job.step!==job.status?<span className="ml-1 text-gray-700">({job.step})</span>:null}</span>
        <div className="flex items-center gap-2">
          {!['done','error'].includes(job.status)&&<button onClick={()=>onCancel(job.id)} className="text-red-500 hover:text-red-400">취소</button>}
          {job.status==='done'&&(
            <div className="flex gap-1.5">
              {job.videoUrl&&<a href={job.videoUrl} download className="px-2 py-0.5 rounded text-xs bg-cyan-900/40 text-cyan-400 border border-cyan-800/40">⬇ 영상</a>}
              {job.thumbUrl&&<a href={job.thumbUrl} download className="px-2 py-0.5 rounded text-xs bg-gray-800 text-gray-400 border border-gray-700/40">🖼</a>}
              {job.ytUrl?<a href={job.ytUrl} target="_blank" className="px-2 py-0.5 rounded text-xs bg-red-900/40 text-red-400 border border-red-800/40">▶ YT</a>:<button onClick={()=>onYTUpload(job.id)} className="px-2 py-0.5 rounded text-xs bg-red-700/20 text-red-400 border border-red-700/30 hover:bg-red-700/40">📺 업로드</button>}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── [v16.14] AI 프로바이더 실시간 핑 모달 ── */
function ProviderStatusModal({ onClose }) {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const PING_META = {
    anthropic:  { label:'Anthropic Claude', icon:'🟣' },
    gemini:     { label:'Google Gemini',    icon:'🔵' },
    xai:        { label:'Grok (xAI)',       icon:'𝕏'  },
    groq:       { label:'Groq',             icon:'🚀' },
    cerebras:   { label:'Cerebras',         icon:'⚡' },
    sambanova:  { label:'SambaNova',        icon:'🦙' },
    openrouter: { label:'OpenRouter',       icon:'🌐' },
    pexels:     { label:'Pexels (영상)',    icon:'🎬' },
    pixabay:    { label:'Pixabay (영상)',   icon:'🖼️' },
  };
  const fetchPing = async () => {
    setLoading(true);
    try {
      const r = await fetch(API.providerPing, { headers:{'X-LF-API-Key':LF_KEY}, signal:AbortSignal.timeout(15000) });
      const j = await r.json();
      setData(j.providers || {});
    } catch(e) { setData(null); }
    setLoading(false);
  };
  React.useEffect(()=>{ fetchPing(); },[]);
  const badgeInfo = (p) => {
    if(p.no_key) return {color:'text-gray-500 bg-gray-800', label:'키 없음'};
    if(p.ok)     return {color:'text-green-400 bg-green-900/30', label:`✓ ${p.latency_ms}ms`};
    if(p.status===401||p.status===403) return {color:'text-yellow-400 bg-yellow-900/20', label:`⚠ 키오류(${p.status})`};
    return {color:'text-red-400 bg-red-900/20', label:`✗ ${p.status||'Err'}`};
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:'rgba(0,0,0,0.75)', backdropFilter:'blur(4px)'}}>
      <div className="bg-lf-card border border-lf-border rounded-2xl p-6 w-full max-w-md shadow-2xl">
        <div className="flex items-center justify-between mb-5">
          <h2 className="text-white font-bold text-base flex items-center gap-2">🔬 AI 프로바이더 실시간 상태</h2>
          <div className="flex items-center gap-2">
            <button onClick={fetchPing} disabled={loading} className="text-xs text-cyan-400 hover:text-cyan-300 border border-cyan-700/40 px-2 py-1 rounded-lg disabled:opacity-50">↻ 재검사</button>
            <button onClick={onClose} className="text-gray-500 hover:text-white text-xl leading-none">×</button>
          </div>
        </div>
        {loading ? (
          <div className="text-center py-10 text-gray-500">
            <div className="text-2xl mb-2 animate-pulse">🔬</div>
            <div className="text-sm">API 핑 테스트 중… (최대 15초)</div>
          </div>
        ) : !data ? (
          <div className="text-center py-10 text-red-400 text-sm">서버 응답 없음. FFmpeg 컨테이너 상태 확인 필요.</div>
        ) : (
          <div className="space-y-2">
            {Object.entries(PING_META).map(([key, meta]) => {
              const p = data[key] || {ok:false, status:0, no_key:true};
              const badge = badgeInfo(p);
              return (
                <div key={key} className="flex items-center justify-between px-3 py-2.5 rounded-xl border border-lf-border bg-lf-bg hover:border-gray-600 transition-colors">
                  <div className="flex items-center gap-2.5">
                    <span className="text-base">{meta.icon}</span>
                    <span className="text-sm text-white">{meta.label}</span>
                  </div>
                  <span className={cls('text-xs font-semibold px-2.5 py-1 rounded-full', badge.color)}>{badge.label}</span>
                </div>
              );
            })}
            <div className="text-xs text-gray-700 text-center mt-3">

function App() {
  const [health,           setHealth]           = useState(()=>Object.fromEntries(SERVICES.map(s=>[s.key,{status:'loading',latency:null}])));
  const [providers,        setProviders]        = useState({});
  const [lastUsedProvider, setLastUsedProvider] = useState(null);
  const [jobs,             setJobs]             = useState([]);
  const [submitting,       setSubmitting]       = useState(false);
  const [showProviderModal,setShowProviderModal]= useState(false);
  const [toasts,           setToasts]           = useState([]);
  const [lastCheck,        setLastCheck]        = useState(null);
  const [activeTab,        setActiveTab]        = useState('generate');
  const [ytPrefill,        setYtPrefill]        = useState('');

  const addToast = useCallback((msg,type='info')=>{
    const id=Date.now(); setToasts(p=>[...p,{id,msg,type}]); setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),4500);
  },[]);

  const checkHealth = useCallback(async()=>{
    const results = await Promise.allSettled(SERVICES.map(async(svc)=>{
      const start=performance.now();
      try{const r=await fetch(API.health[svc.key],{signal:AbortSignal.timeout(4000)});return{key:svc.key,status:r.ok?'healthy':'degraded',latency:Math.round(performance.now()-start)};}
      catch{return{key:svc.key,status:'offline',latency:null};}
    }));
    setHealth(prev=>{const next={...prev};for(const r of results)if(r.status==='fulfilled')next[r.value.key]={status:r.value.status,latency:r.value.latency};return next;});
    setLastCheck(new Date());
    try{const pr=await fetch(API.providers,{headers:{'X-LF-API-Key':LF_KEY},signal:AbortSignal.timeout(4000)});if(pr.ok){const data=await pr.json();setProviders(data.providers||{});}}catch{}
  },[]);

  useEffect(()=>{checkHealth();const h=setInterval(checkHealth,30000);return()=>clearInterval(h);},[checkHealth]);

  const pollFfmpegUntilDone = useCallback((jobId, isAuto=false)=>new Promise(resolve=>{
    const timer=setInterval(async()=>{
      try{
        // auto pipeline: /job/{id}/status, legacy: /api/ffmpeg/job/{id}/status
        const endpoint = isAuto
          ? `${BASE}/api/ffmpeg/job/${jobId}/status`
          : `/api/ffmpeg/job/${jobId}/status`;
        const r=await fetch(endpoint,{headers:{'X-LF-API-Key':LF_KEY},signal:AbortSignal.timeout(5000)});
        if(!r.ok)return;
        const d=await r.json();
        const st=(d.status||'').toLowerCase();
        const prog=d.progress||0;
        const currentStep=d.current_step||d.step||st;
        // 상태 → UI 진행률 매핑 (auto pipeline 상세 단계)
        const autoProgressMap={queued:3,generating_script:10,asset_searching:25,downloading_assets:45,tts_generating:60,video_rendering:75,finalizing:90,completed:100};
        const uiProg = isAuto ? (autoProgressMap[st]||prog) : (55+Math.round(prog*0.44));
        if(st==='completed'||st==='done'){
          clearInterval(timer);
          const files=d.output_files||{}; const toUrl=(p)=>p?'/output/'+p.replace('/data/output/','').replace(/\\/g,'/'):null;
          const videoUrl=toUrl(files.longform||files.shorts||files.music_video); const thumbUrl=toUrl(files.thumbnail);
          setJobs(prev=>prev.map(j=>j.id===jobId?{...j,status:'done',progress:100,videoUrl,thumbUrl}:j));
          addToast('✅ 영상 완성! 다운로드 가능','success'); resolve('done');
        }else if(st==='failed'||st==='error'){
          clearInterval(timer); setJobs(prev=>prev.map(j=>j.id===jobId?{...j,status:'error',step:st}:j)); addToast('❌ 렌더링 실패','error'); resolve('failed');
        }else{
          setJobs(prev=>prev.map(j=>j.id===jobId?{...j,status:st,step:currentStep,progress:uiProg}:j));
        }
      }catch{}
    },2500);
  }),[addToast]);

  const autoUploadToYT = useCallback(async(jobId)=>{
    try{
      addToast('📺 YouTube 자동 업로드 중...','info');
      setJobs(prev=>prev.map(j=>j.id===jobId?{...j,status:'uploading'}:j));
      const r=await fetch(API.ytUpload,{method:'POST',headers:HEADERS_JSON,body:JSON.stringify({job_id:jobId,type:'longform',privacy:'public',notify_subscribers:true})});
      const data=await r.json();
      if(data.success||data.video_id||data.url){setJobs(prev=>prev.map(j=>j.id===jobId?{...j,ytUrl:data.url||data.video_url||null}:j));addToast('✅ YouTube 자동 업로드 완료!','success');}
      else throw new Error(data.error||data.detail||'업로드 실패');
    }catch(e){addToast(`YouTube 오류: ${e.message}`,'error');}
  },[addToast]);

  const handleSubmit = useCallback(async(form)=>{
    if(!form.topic.trim())return;
    setSubmitting(true);
    const jobId=`lf_${Date.now()}`;
    setJobs(p=>[{id:jobId,topic:form.topic,mode:form.mode,status:'queued',progress:2,startedAt:Date.now(),provider:'claude',isReal:true,autoUpload:form.autoUpload,isAuto:form.autoMode},...p]);
    try{
      // ⚡ Auto 파이프라인 (v15.95)
      if(form.autoMode && form.mode!=='music_video'){
        addToast('⚡ Auto 파이프라인 v15.95 시작...','info');
        const aRes=await fetch(`${BASE}/api/ffmpeg/api/auto/topic-job`,{method:'POST',headers:HEADERS_JSON,body:JSON.stringify({
          topic:form.topic, target_duration_sec:parseInt(form.duration),
          tone:form.style==='professional'?'news':form.style,
          language:form.language, job_id:jobId,
        })});
        const aData=await aRes.json();
        if(!aRes.ok)throw new Error(aData.detail||`Auto 파이프라인 오류 ${aRes.status}`);
        const realJobId=aData.job_id||jobId;
        setJobs(p=>p.map(j=>j.id===jobId?{...j,id:realJobId,status:'generating_script',progress:5}:j));
        addToast(`⚡ Auto 잡 시작됨 (${realJobId.substring(0,20)}...)`, 'success');
        const result=await pollFfmpegUntilDone(realJobId, true);
        if(result==='done'&&form.autoUpload)await autoUploadToYT(realJobId);
        return;
      }
      // 1단계: 스크립트 (레거시)
      addToast('🧠 AI 스크립트 생성 중...','info');
      const r1=await fetch(API.generate,{method:'POST',headers:HEADERS_JSON,body:JSON.stringify({topic:form.topic,language:form.language,duration_seconds:parseInt(form.duration),style:form.style,provider:form.provider,target_audience:'general'})});
      const scriptData=await r1.json();
      if(!r1.ok&&!scriptData.success)throw new Error(scriptData.error||`AI 오류 ${r1.status}`);
      const usedProvider=scriptData.provider||'unknown';
      setLastUsedProvider(usedProvider);
      setJobs(p=>p.map(j=>j.id===jobId?{...j,provider:usedProvider,progress:25}:j));
      addToast(`✅ 스크립트 완성 (${usedProvider})`,'success');

      let scriptText=scriptData.script_text||'';
      if(!scriptText&&scriptData.intro){scriptText=scriptData.intro;if(scriptData.main_points)scriptText+=' '+scriptData.main_points.join(' ');if(scriptData.outro)scriptText+=' '+scriptData.outro;}
      if(!scriptText)scriptText=scriptData.title||form.topic;

      // 2단계: TTS
      if(form.mode!=='music_video'){
        setJobs(p=>p.map(j=>j.id===jobId?{...j,status:'tts',progress:30}:j));
        addToast('🎙️ TTS 생성 중...','info');
        const r2=await fetch(`${BASE}/api/tts/tts`,{method:'POST',headers:HEADERS_JSON,body:JSON.stringify({text:scriptText,filename:jobId,voice_id:'SAz9YHcvj6GT2YYXdXww'})});
        const ttsData=await r2.json();
        if(!r2.ok||!ttsData.success)throw new Error(ttsData.message||'TTS 실패');
        setJobs(p=>p.map(j=>j.id===jobId?{...j,progress:45}:j));
        addToast('✅ TTS 완성','success');
      }else{addToast('🎵 뮤직비디오: TTS 스킵','info');setJobs(p=>p.map(j=>j.id===jobId?{...j,progress:45}:j));}

      // 3단계: Assets
      setJobs(p=>p.map(j=>j.id===jobId?{...j,status:'assets',progress:50}:j));
      addToast('🔍 영상 소스 검색 중...','info');
      const rawScenes=scriptData.scenes||scriptData.sections||[];
      const scenes=rawScenes.length>0?rawScenes.map((s,i)=>({scene_id:s.scene_id?`scene_${s.scene_id}`:`scene_${i+1}`,keyword:s.keyword||s.description||s.visual||'technology',duration_seconds:s.duration_seconds||s.duration||10,description:s.description||s.visual||''})):[{scene_id:'scene_1',keyword:'technology innovation',duration_seconds:10,description:''},{scene_id:'scene_2',keyword:'global business news',duration_seconds:10,description:''},{scene_id:'scene_3',keyword:'future digital world',duration_seconds:10,description:''}];
      const r2b=await fetch(`${BASE}/api/ffmpeg/assets/search`,{method:'POST',headers:HEADERS_JSON,body:JSON.stringify({job_id:jobId,scenes,sources:'pexels,pixabay'})});
      if(!r2b.ok){const ea=await r2b.json();throw new Error(ea.detail||'Assets 검색 실패');}
      setJobs(p=>p.map(j=>j.id===jobId?{...j,progress:55}:j));
      addToast('✅ 소스 준비 완료','success');

      // 4단계: FFmpeg
      setJobs(p=>p.map(j=>j.id===jobId?{...j,status:'rendering',progress:60}:j));
      addToast('🎬 영상 렌더링 시작...','info');
      const isMV=form.mode==='music_video';
      const r3=await fetch(`${BASE}/api/ffmpeg/video/create`,{method:'POST',headers:HEADERS_JSON,body:JSON.stringify({job_id:jobId,mode:isMV?'music_video':(form.mode==='shorts'?'shorts':'longform'),title:scriptData.title||form.topic,generate_thumbnail:true,generate_shorts:!isMV&&form.mode!=='shorts',add_bgm:true,bgm_volume:isMV?0.8:0.25,subtitle_text:isMV?scriptText:null})});
      if(!r3.ok){const e3=await r3.json();throw new Error(e3.detail||'FFmpeg 시작 실패');}
      addToast('⏳ 렌더링 중...','info');

      // 5단계: 폴링
      const result=await pollFfmpegUntilDone(jobId);

      // 6단계: 자동업로드
      if(result==='done'&&form.autoUpload)await autoUploadToYT(jobId);

    }catch(e){setJobs(p=>p.map(j=>j.id===jobId?{...j,status:'error'}:j));addToast(`❌ 오류: ${e.message}`,'error');}
    finally{setSubmitting(false);}
  },[addToast,pollFfmpegUntilDone,autoUploadToYT]);

  const handleCancel = useCallback((id)=>{setJobs(p=>p.map(j=>j.id===id?{...j,status:'error'}:j));addToast('취소됨','info');},[addToast]);
  const handleYTUpload = useCallback((jobId)=>{setYtPrefill(jobId);setActiveTab('upload');addToast('📺 Job ID 자동입력 — 업로드 탭 이동','info');},[addToast]);

  const healthyCount=SERVICES.filter(s=>health[s.key]?.status==='healthy').length;
  const availProviders=Object.values(providers).filter(p=>p?.available).length;
  const doneJobs=jobs.filter(j=>j.status==='done').length;
  const activeJobs=jobs.filter(j=>!['done','error'].includes(j.status)).length;

  return (
    <>{showProviderModal&&<ProviderStatusModal onClose={()=>setShowProviderModal(false)}/>}
    <div className="min-h-screen text-white" style={{background:'#060B17'}}>
      <header className="border-b border-lf-border sticky top-0 z-40" style={{background:'rgba(6,11,23,0.88)',backdropFilter:'blur(16px)'}}>
        <div className="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-xl flex items-center justify-center text-base gradient-btn">🎬</div>
            <div><div className="font-bold text-sm gradient-text">LongForm Factory</div><div className="text-gray-700 text-xs">v3.5 · v15.98 · 반복나레이션제거 · 자막개선</div></div>
          </div>
          <div className="flex items-center gap-4">
            {availProviders>0&&<div className="hidden md:flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20"><StatusDot status="healthy"/><span className="text-xs text-cyan-400">{availProviders}개 AI 활성</span></div>}
            <div className="flex items-center gap-2"><span className={`w-2 h-2 rounded-full ${healthyCount===SERVICES.length?'bg-green-400 animate-pulse':healthyCount>0?'bg-yellow-400':'bg-red-500'}`}/><span className="text-xs text-gray-500">{healthyCount}/{SERVICES.length} 서비스</span></div>
            <button onClick={()=>setShowProviderModal(true)} className="text-xs px-3 py-1.5 rounded-lg border border-purple-700/40 text-purple-400 hover:border-purple-500 hover:text-purple-300 transition-colors">🔬 AI 상태</button>
            <a href="http://localhost:8080/n8n/home/workflows" target="_blank" className="text-xs px-3 py-1.5 rounded-lg border" style={{color:'#00D4FF',borderColor:'rgba(0,212,255,0.25)'}}>n8n →</a>
            {lastCheck&&<span className="text-xs text-gray-700 hidden lg:block">{lastCheck.toLocaleTimeString('ko-KR')}</span>}
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-6 py-7 space-y-7">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <StatCard icon="✅" label="오늘 완료"    value={doneJobs}   sub="영상"                        color="text-cyan-400"/>
          <StatCard icon="⚡" label="진행 중"      value={activeJobs} sub="작업"                        color="text-yellow-400"/>
          <StatCard icon="🧠" label="AI 프로바이더" value={`${availProviders}/8`} sub="활성"             color="text-purple-400"/>
          <StatCard icon="🔧" label="서비스"       value={`${healthyCount}/${SERVICES.length}`} sub="정상" color="text-green-400"/>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-3 gap-7">
          <div className="space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-xs font-semibold text-gray-400 uppercase tracking-wider">서비스 상태</h2>
              <button onClick={checkHealth} className="text-xs text-gray-600 hover:text-cyan-400">↻ 갱신</button>
            </div>
            {SERVICES.map(svc=><ServiceCard key={svc.key} service={svc} status={health[svc.key]?.status} latency={health[svc.key]?.latency}/>)}
            <ProviderGrid providers={providers} lastUsed={lastUsedProvider}/>
          </div>

          <div className="lg:col-span-2 space-y-6">
            <div className="flex border-b border-lf-border">
              {[{key:'generate',label:'🧠 영상 생성'},{key:'upload',label:'📺 YouTube 업로드'},{key:'verify',label:'🧪 패치 검증'}].map(tab=>(
                <button key={tab.key} onClick={()=>setActiveTab(tab.key)} className={cls('px-5 py-3 text-sm font-semibold transition-colors',activeTab===tab.key?'tab-active':'tab-inactive hover:text-gray-300')}>{tab.label}</button>
              ))}
            </div>
            <div>{activeTab==='generate'?<GenerateForm onSubmit={handleSubmit} loading={submitting}/>:activeTab==='upload'?<YouTubeUploadForm onToast={addToast} prefillJobId={ytPrefill}/>:<PatchVerifyPanel addToast={addToast}/>}</div>

            <div>
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-xs font-semibold text-gray-400 uppercase tracking-wider">작업 큐 {jobs.length>0&&`(${jobs.length})`}</h2>
                {jobs.some(j=>['done','error'].includes(j.status))&&<button onClick={()=>setJobs(p=>p.filter(j=>!['done','error'].includes(j.status)))} className="text-xs text-gray-600 hover:text-red-400">완료 지우기</button>}
              </div>
              {jobs.length===0?(
                <div className="bg-lf-card border border-lf-border rounded-xl p-10 text-center"><div className="text-4xl mb-3 opacity-20">🎬</div><div className="text-gray-600 text-sm">작업 없음</div><div className="text-gray-700 text-xs mt-1">영상 생성 탭에서 시작하세요</div></div>
              ):(
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{jobs.map(job=><JobCard key={job.id} job={job} onCancel={handleCancel} onYTUpload={handleYTUpload}/>)}</div>
              )}
            </div>

            <PipelineDiagram health={health}/>

            <div className="grid grid-cols-2 gap-3">
              {[{href:'http://localhost:8080/n8n/home/workflows',icon:'🎬',label:'롱폼 파이프라인',sub:'n8n 워크플로우'},{href:'http://localhost:8080/n8n/home/workflows',icon:'📱',label:'숏폼 파이프라인',sub:'n8n 워크플로우'}].map(item=>(
                <a key={item.label} href={item.href} target="_blank" className="bg-lf-card border border-lf-border rounded-xl p-4 card-hover flex items-center gap-3 hover:border-gray-600 transition-all">
                  <div className="w-10 h-10 rounded-lg bg-white/5 flex items-center justify-center text-xl">{item.icon}</div>
                  <div><div className="text-white text-sm font-medium">{item.label}</div><div className="text-gray-600 text-xs">{item.sub}</div></div>
                  <div className="ml-auto text-gray-700">→</div>
                </a>
              ))}
            </div>
          </div>
        </div>
      </main>

      <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2" style={{maxWidth:340}}>
        {toasts.map(t=>(
          <div key={t.id} onClick={()=>setToasts(p=>p.filter(x=>x.id!==t.id))} className={cls('flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer shadow-xl border text-sm text-white',t.type==='error'?'bg-red-950 border-red-800/50':t.type==='success'?'bg-green-950 border-green-800/50':'bg-lf-card border-lf-border')}>
            <span className="shrink-0">{t.type==='error'?'❌':t.type==='success'?'✅':'ℹ️'}</span>
            <span className="text-xs leading-snug">{t.msg}</span>
          </div>
        ))}
      </div>
    </div>
  );
}


// ============================================================
// PatchVerifyPanel — v15.98 패치 검증 & 실시간 모니터
// ============================================================
const PATCH_META = [
  { id:'A', label:'SUB_DUR 3.0s / 서브클립 ×8', tag:'[v15.98]', hint:'SUB_DUR' },
  { id:'B', label:'Hook 5초 / Rehook 70초',      tag:'[v15.98]', hint:'hook' },
  { id:'C', label:'섹션 레이블 제거',             tag:'[v15.98] section label', hint:'section label' },
  { id:'D', label:'맞춤법 LLM 검증',             tag:'[v15.98] spell check',   hint:'spell check' },
  { id:'E', label:'CTR 제목 3후보 선택',          tag:'[v15.98] CTR title',     hint:'CTR title' },
  { id:'TTS', label:'TTS 속도 +10%',             tag:'+5%',                    hint:'rate=+5%' },
];

function PatchVerifyPanel({ addToast }) {
  const [version,   setVersion]   = React.useState(null);
  const [autoJobs,  setAutoJobs]  = React.useState([]);
  const [logs,      setLogs]      = React.useState([]);
  const [selJob,    setSelJob]    = React.useState(null);
  const [launching, setLaunching] = React.useState(false);
  const [testTopic, setTestTopic] = React.useState('2026년 AI 반도체 글로벌 패권 전쟁');
  const [patches,   setPatches]   = React.useState({});
  const logEndRef = React.useRef(null);

  // 버전 및 잡 목록 폴링
  const refresh = React.useCallback(async () => {
    try {
      const [hRes, jRes] = await Promise.all([
        fetch(API.ffmpegHealth, { headers: HEADERS_JSON }),
        fetch(API.autoJobs,     { headers: HEADERS_JSON }),
      ]);
      if (hRes.ok) { const d = await hRes.json(); setVersion(d.version); }
      if (jRes.ok) { const d = await jRes.json(); setAutoJobs(d.jobs || []); }
    } catch(e) { /* ignore */ }
  }, []);

  // 선택 잡 로그 폴링
  const pollJob = React.useCallback(async (jobId) => {
    try {
      const r = await fetch(API.autoStatus(jobId), { headers: HEADERS_JSON });
      if (!r.ok) return;
      const d = await r.json();
      const entry = `[${new Date().toLocaleTimeString('ko-KR')}] ${d.status} ${d.progress||0}%` +
        (d.current_step ? ` | ${d.current_step}` : '') +
        (d.error ? ` ❌ ${d.error}` : '');
      setLogs(p => {
        const next = [...p, entry].slice(-80);
        // v15.98 패치 히트 감지
        const hits = {};
        PATCH_META.forEach(pm => {
          hits[pm.id] = next.some(l => l.toLowerCase().includes(pm.hint.toLowerCase()));
        });
        setPatches(hits);
        return next;
      });
    } catch(e) { /* ignore */ }
  }, []);

  // 도커 로그에서 v15.98 히트 직접 검색 (별도 엔드포인트 없으므로 job status로 추론)
  React.useEffect(() => {
    refresh();
    const t1 = setInterval(refresh, 5000);
    return () => clearInterval(t1);
  }, [refresh]);

  React.useEffect(() => {
    if (!selJob) return;
    const t2 = setInterval(() => pollJob(selJob), 3000);
    pollJob(selJob);
    return () => clearInterval(t2);
  }, [selJob, pollJob]);

  React.useEffect(() => {
    logEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [logs]);

  const launchTest = async () => {
    if (!testTopic.trim()) return;
    setLaunching(true);
    try {
      const r = await fetch(API.autoCreate, {
        method: 'POST', headers: HEADERS_JSON,
        body: JSON.stringify({ topic: testTopic, target_duration_sec: 300, tone: 'news', language: 'ko' })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
      addToast(`🧪 테스트 잡 시작: ${d.job_id}`, 'success');
      setSelJob(d.job_id);
      setLogs([]);
      await refresh();
    } catch(e) { addToast(`❌ 테스트 실패: ${e.message}`, 'error'); }
    finally { setLaunching(false); }
  };

  const statusColor = s => ({
    completed:'text-green-400', failed:'text-red-400', tts_generating:'text-cyan-400',
    downloading_assets:'text-blue-400', rendering:'text-yellow-400',
    generating_script:'text-purple-400', script_generated:'text-purple-300',
  }[s] || 'text-gray-400');

  return (
    <div className="space-y-5">
      {/* 버전 배지 */}
      <div className="flex items-center gap-3 p-4 rounded-xl bg-lf-card border border-lf-border">
        <span className="text-2xl">🏷️</span>
        <div>
          <div className="text-white font-semibold text-sm">실행 중 버전</div>
          <div className="text-xs text-gray-500 mt-0.5">컨테이너 ffmpeg-worker</div>
        </div>
        <div className="ml-auto text-right">
          {version
            ? <span className={`text-lg font-bold ${version.startsWith('15.98') ? 'text-green-400' : 'text-yellow-400'}`}>v{version}</span>
            : <span className="text-gray-600 text-sm animate-pulse">조회 중…</span>}
          {version && <div className="text-xs mt-0.5 text-gray-600">{version.startsWith('15.98') ? '✅ v15.98 최신' : '⚠️ 업데이트 필요'}</div>}
        </div>
      </div>

      {/* 패치 체크리스트 */}
      <div className="p-4 rounded-xl bg-lf-card border border-lf-border">
        <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">v15.98 패치 항목 (잡 실행 후 자동 감지)</div>
        <div className="grid grid-cols-1 gap-2">
          {PATCH_META.map(pm => {
            const hit = patches[pm.id];
            return (
              <div key={pm.id} className={`flex items-center gap-3 px-3 py-2 rounded-lg border transition-all ${hit ? 'border-green-700/50 bg-green-900/10' : 'border-lf-border bg-white/2'}`}>
                <span className={`text-sm font-bold w-8 text-center ${hit ? 'text-green-400' : 'text-gray-600'}`}>{hit ? '✅' : `P${pm.id}`}</span>
                <div className="flex-1">
                  <div className={`text-xs font-medium ${hit ? 'text-green-300' : 'text-gray-400'}`}>{pm.label}</div>
                  <div className="text-xs text-gray-700 font-mono">{pm.tag}</div>
                </div>
                {hit && <span className="text-xs text-green-500">감지됨</span>}
              </div>
            );
          })}
        </div>
      </div>

      {/* 테스트 잡 실행 */}
      <div className="p-4 rounded-xl bg-lf-card border border-cyan-900/40">
        <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">🚀 빠른 테스트 잡</div>
        <input
          value={testTopic}
          onChange={e => setTestTopic(e.target.value)}
          className="w-full bg-lf-bg border border-lf-border rounded-lg px-3 py-2 text-sm text-white mb-3 focus:outline-none focus:border-cyan-500"
          placeholder="테스트 주제 입력…"
        />
        <button
          onClick={launchTest}
          disabled={launching || !testTopic.trim()}
          className="w-full py-2.5 rounded-xl text-sm font-bold disabled:opacity-40 gradient-btn text-white"
        >
          {launching ? '⏳ 잡 생성 중…' : '🧪 테스트 잡 실행'}
        </button>
      </div>

      {/* 잡 목록 */}
      {autoJobs.length > 0 && (
        <div className="p-4 rounded-xl bg-lf-card border border-lf-border">
          <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">📋 Auto 잡 목록</div>
          <div className="space-y-2">
            {autoJobs.map(j => (
              <button
                key={j.job_id}
                onClick={() => { setSelJob(j.job_id); setLogs([]); }}
                className={`w-full text-left px-3 py-2 rounded-lg border transition-all ${selJob === j.job_id ? 'border-cyan-500/60 bg-cyan-900/15' : 'border-lf-border hover:border-gray-600'}`}
              >
                <div className="flex items-center justify-between">
                  <span className="text-xs font-mono text-gray-400 truncate">{j.job_id}</span>
                  <span className={`text-xs font-semibold ml-2 shrink-0 ${statusColor(j.status)}`}>{j.progress||0}%</span>
                </div>
                <div className="flex items-center justify-between mt-0.5">
                  <span className="text-xs text-white truncate">{j.topic}</span>
                  <span className={`text-xs ml-2 shrink-0 ${statusColor(j.status)}`}>{j.status}</span>
                </div>
                {j.quality_score && <div className="text-xs text-yellow-400 mt-0.5">⭐ 품질 {j.quality_score}</div>}
              </button>
            ))}
          </div>
        </div>
      )}

      {/* 실시간 로그 */}
      {selJob && (
        <div className="p-4 rounded-xl bg-black/40 border border-lf-border">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider">📡 실시간 상태 폴링</div>
            <div className="flex items-center gap-2">
              <span className="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse inline-block"/>
              <span className="text-xs text-gray-600 font-mono truncate">{selJob}</span>
              <button onClick={() => setLogs([])} className="text-xs text-gray-600 hover:text-red-400">지우기</button>
            </div>
          </div>
          <div className="h-48 overflow-y-auto font-mono text-xs space-y-0.5 pr-1">
            {logs.length === 0
              ? <div className="text-gray-700 text-center py-4">로그 대기 중…</div>
              : logs.map((l, i) => (
                <div key={i} className={`leading-5 ${l.includes('❌') ? 'text-red-400' : l.includes('completed') ? 'text-green-400' : 'text-gray-400'}`}>{l}</div>
              ))}
            <div ref={logEndRef}/>
          </div>
        </div>
      )}
    </div>
    </>
  );
}
// ============================================================

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
